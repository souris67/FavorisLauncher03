name: Build FavorisLauncher APKon:  workflow_dispatch:  push:    paths:      - "*.zip"      - ".github/workflows/build-apk.yml"jobs:  build:    runs-on: ubuntu-latest    steps:      - name: Checkout repository        uses: actions/checkout@v4      - name: Extract Android project        run: |          archive=$(find . -maxdepth 1 -name '*.zip' -print -quit)          mkdir project          unzip -q "$archive" -d project          cp -a project/FavorisLauncher/. .      - name: Set up Java        uses: actions/setup-java@v4        with:          distribution: temurin          java-version: '17'      - name: Set up Gradle        uses: gradle/actions/setup-gradle@v4        with:          gradle-version: '8.9'      - name: Build APK        run: gradle assembleDebug      - name: Upload APK        uses: actions/upload-artifact@v4        with:          name: FavorisLauncher-APK          path: app/build/outputs/apk/debug/app-debug.apk
